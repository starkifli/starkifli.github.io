    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: #F3F5F4; /* warna dasar aplikasi, cegah flash putih */
        }
        iframe {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* Splash screen: tampil saat index dibuka, hilang setelah iframe siap */
        #splash {
            position: fixed;
            inset: 0;
            z-index: 999;
            background: #F3F5F4;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s ease;
        }
        #splash.splash-hide {
            opacity: 0;
            pointer-events: none;
        }
        .splash-inner {
            text-align: center;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        .splash-logo {
            display: block;
            width: 180px;
            height: auto;
            margin: 0 auto 10px;
        }
        .splash-sub {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #E87739; /* senada dengan warna oranye logo */
            margin-top: 3px;
        }
        .splash-spinner {
            width: 28px;
            height: 28px;
            margin: 20px auto 0;
            border: 3px solid #F5DCCB;
            border-top-color: #E87739; /* senada dengan warna oranye logo */
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
