<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Tribina Group - Sistem Absensi Outsource</title>
    <!-- Logo untuk tab browser (favicon) -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Ccircle cx='24' cy='24' r='22' fill='%231F5F3F'/%3E%3Cpath d='M14 25 L21 32 L34 17' fill='none' stroke='%23FFFFFF' stroke-width='4.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" type="image/svg+xml">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: #F3F5F4; /* warna dasar aplikasi, cegah flash putih */
        }
        iframe {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* Splash screen: tampil saat index dibuka, hilang setelah iframe siap */
        #splash {
            position: fixed;
            inset: 0;
            z-index: 999;
            background: #F3F5F4;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s ease;
        }
        #splash.splash-hide {
            opacity: 0;
            pointer-events: none;
        }
        .splash-inner {
            text-align: center;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        .splash-logo {
            display: block;
            margin: 0 auto 14px;
        }
        .splash-text {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 2px;
            color: #1F5F3F;
        }
        .splash-sub {
            font-size: 11px;
            font-weight: 400;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #6B7A71;
            margin-top: 3px;
        }
        .splash-spinner {
            width: 28px;
            height: 28px;
            margin: 20px auto 0;
            border: 3px solid #D5E4DA;
            border-top-color: #1F5F3F;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- Splash screen dengan logo -->
    <div id="splash">
        <div class="splash-inner">
            <svg class="splash-logo" width="64" height="64" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Logo Tribina Group">
                <circle cx="24" cy="24" r="22" fill="#1F5F3F"/>
                <path d="M14 25 L21 32 L34 17" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M14 25 L21 32 L34 17" fill="none" stroke="#8FD6B2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <div class="splash-text">Tribina Group</div>
            <div class="splash-sub">Sistem Absensi Outsource</div>
            <div class="splash-spinner"></div>
        </div>
    </div>

    <!-- Ganti URL_DEPLOY_LO dengan link Apps Script lo yang udah di-deploy -->
    <iframe
        id="app-frame"
        src="https://script.google.com/macros/s/AKfycbzGn2S4EVgHdGLMy3e58LFXzGQpqEHglrYwMNIj8dVxtbC7ew53Z-rjP6Kh8vr9YRzW/exec"
        title="Aplikasi Absensi"
        allow="clipboard-write">
    </iframe>

    <script>
        (function () {
            var splash = document.getElementById('splash');
            var frame = document.getElementById('app-frame');
            var hidden = false;

            function hideSplash() {
                if (hidden) return;
                hidden = true;
                splash.classList.add('splash-hide');
                // Hapus dari layar setelah transisi selesai
                setTimeout(function () {
                    splash.style.display = 'none';
                }, 550);
            }

            // Sembunyikan saat iframe selesai dimuat
            frame.addEventListener('load', hideSplash);

            // Fallback: jangan biarkan splash keblok selamanya (mis. koneksi lambat/putus)
            setTimeout(hideSplash, 10000);
        })();
    </script>
</body>
</html>
